[
build
]
  command = "npm run build"
  publish = "dist"
  base = "/"

[
build.environment
]
  NODE_VERSION = "18"
  PHP_VERSION = "8.2"

[
context.production
]
  command = "npm run build"
  environment = { NODE_ENV = "production" }

[
context.development
]
  command = "npm run build:dev"
  environment = { NODE_ENV = "development" }

[[
redirects
]]
  from = "/*"
  to = "/index.html"
  status = 200

[[
headers
]]
  for = "/*"
  [
headers.values
]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
